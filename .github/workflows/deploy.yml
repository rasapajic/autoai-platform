name: AutoAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Validate active M0.2 backend syntax
        run: |
          cd backend
          python -m compileall -q app/api app/ai app/core app/models app/main.py
          python -m py_compile \
            scripts/scraper.py \
            app/scrapers/willhaben.py \
            app/scrapers/autoscout24.py \
            app/scrapers/marktplaats.py \
            app/scrapers/tweedehands.py \
            app/scrapers/kleinanzeigen.py

      - name: Run backend tests
        run: |
          cd backend
          python -m pip install pytest
          python -m pytest tests/ -v --tb=short

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build
