name: AutoAI Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Validate active M0.2 backend syntax
        run: |
          cd backend
          python -m compileall -q app/api app/ai app/core app/models app/main.py
          python -m py_compile \
            scripts/scraper.py \
            app/scrapers/willhaben.py \
            app/scrapers/autoscout24.py \
            app/scrapers/marktplaats.py \
            app/scrapers/tweedehands.py \
            app/scrapers/kleinanzeigen.py

      - name: Run backend tests
        run: |
          cd backend
          python -m pip install pytest
          python -m pytest tests/ -v --tb=short

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Discover Railway services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway status --json | jq '{project: .name, environment: .environment.name, services: [.services.edges[].node | {id, name}]}'
          railway service list --json | jq .

      - name: Configure guarded internal refresh
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          INTERNAL_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$INTERNAL_SECRET"
          echo "AUTOAI_INTERNAL_SECRET=$INTERNAL_SECRET" >> "$GITHUB_ENV"

          railway variable set --service autoai-platform --skip-deploys \
            "AUTOAI_ADMIN_SECRET=$INTERNAL_SECRET" \
            "AUTOAI_INTERNAL_LISTING_INGEST_ENABLED=true" \
            "AUTOAI_INTERNAL_LISTING_SOURCES=willhaben,autoscout24,marktplaats,2dehands,kleinanzeigen"

          railway variable set --service appealing-communication --skip-deploys \
            "AUTOAI_ADMIN_SECRET=$INTERNAL_SECRET" \
            "AUTOAI_BACKEND_URL=https://autoai-platform-production.up.railway.app" \
            "AUTOAI_CRON_MAX_PAGES=3"

      - name: Deploy Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service autoai-platform

      - name: Wait for M0.2 backend
        run: |
          for attempt in $(seq 1 60); do
            HEALTH="$(curl --silent --show-error --max-time 20 \
              https://autoai-platform-production.up.railway.app/health || true)"
            if echo "$HEALTH" | jq -e \
              '.status == "ok" and .version == "1.0.3-m02-scheduled-refresh" and .external_data_updates == "internal_scheduled_refresh"' \
              >/dev/null; then
              echo "$HEALTH" | jq .
              exit 0
            fi
            echo "Backend is not ready yet (attempt $attempt/60)."
            sleep 10
          done
          echo "::error::M0.2 backend did not become healthy in time"
          exit 1

      - name: Deploy Frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service content-youth

      - name: Deploy Cron
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service appealing-communication

      - name: Probe every source before schedule activation
        if: ${{ hashFiles('.github/AUTOAI_M02_SCHEDULE_ENABLE_PENDING') != '' }}
        env:
          INTERNAL_URL: https://autoai-platform-production.up.railway.app/api/v1/internal/m01
        run: |
          curl --silent --show-error --fail-with-body --max-time 900 \
            --request POST \
            --header "X-AutoAI-Admin-Secret: $AUTOAI_INTERNAL_SECRET" \
            "$INTERNAL_URL/probe-all?max_pages=1" \
            --output /tmp/autoai-probe.json
          jq -e '
            .status == "ok" and
            .database_changed == false and
            ([.by_source.willhaben.accepted,
              .by_source.autoscout24.accepted,
              .by_source.marktplaats.accepted,
              .by_source["2dehands"].accepted,
              .by_source.kleinanzeigen.accepted] | all(. > 0))
          ' /tmp/autoai-probe.json >/dev/null
          jq '{status, database_changed, by_source}' /tmp/autoai-probe.json

      - name: Run first relationship-safe scheduled refresh
        if: ${{ hashFiles('.github/AUTOAI_M02_SCHEDULE_ENABLE_PENDING') != '' }}
        env:
          INTERNAL_URL: https://autoai-platform-production.up.railway.app/api/v1/internal/m01
        run: |
          curl --silent --show-error --fail-with-body --max-time 1800 \
            --request POST \
            --header "X-AutoAI-Admin-Secret: $AUTOAI_INTERNAL_SECRET" \
            "$INTERNAL_URL/scheduled-refresh?confirm=REFRESH_ACTIVE_INTERNAL_CATALOG&max_pages=3" \
            --output /tmp/autoai-refresh.json
          jq -e '
            .status == "ok" and
            .active_after > 0 and
            .active_after == (.new + .updated) and
            ([.by_source.willhaben.accepted,
              .by_source.autoscout24.accepted,
              .by_source.marktplaats.accepted,
              .by_source["2dehands"].accepted,
              .by_source.kleinanzeigen.accepted] | all(. > 0))
          ' /tmp/autoai-refresh.json >/dev/null
          jq '{status, active_before, new, updated, active_after, inactive_after, by_source}' /tmp/autoai-refresh.json

      - name: Verify active production catalog
        if: ${{ hashFiles('.github/AUTOAI_M02_SCHEDULE_ENABLE_PENDING') != '' }}
        env:
          INTERNAL_URL: https://autoai-platform-production.up.railway.app/api/v1/internal/m01
        run: |
          curl --silent --show-error --fail-with-body --max-time 60 \
            --header "X-AutoAI-Admin-Secret: $AUTOAI_INTERNAL_SECRET" \
            "$INTERNAL_URL/status" \
            --output /tmp/autoai-status.json
          jq -e '
            .status == "ok" and
            .total_active > 0 and
            .total_all >= .total_active and
            ([.active_by_source.willhaben,
              .active_by_source.autoscout24,
              .active_by_source.marktplaats,
              .active_by_source["2dehands"],
              .active_by_source.kleinanzeigen] | all(. > 0))
          ' /tmp/autoai-status.json >/dev/null
          jq '{status, active_by_source, total_active, total_all}' /tmp/autoai-status.json

      - name: Notify deploy success
        run: echo "✅ Deploy uspješan!"
