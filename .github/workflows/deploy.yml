name: AutoAI Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Testiranje ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Validate active M0.1 backend syntax
        run: |
          cd backend
          python -m compileall -q app/api app/ai app/core app/models app/main.py
          python -m py_compile \
            app/scrapers/willhaben.py \
            app/scrapers/autoscout24.py \
            app/scrapers/marktplaats.py \
            app/scrapers/tweedehands.py \
            app/scrapers/kleinanzeigen.py

      - name: Run backend tests if present
        run: |
          cd backend
          if [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install pytest
            python -m pytest tests/ -v --tb=short
          else
            echo "::warning::No backend tests found; backend test suite was not executed"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Probe deployed backend health
        continue-on-error: true
        run: |
          echo "--- AutoAI deployed backend /health ---"
          curl --silent --show-error --fail-with-body --max-time 20 \
            https://autoai-platform-production.up.railway.app/health
          echo

  # ── Deploy na Railway ──────────────────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd backend
          railway up --service backend

      - name: Deploy Frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd frontend
          railway up --service frontend

      - name: Notify deploy success
        run: echo "✅ Deploy uspješan!"
